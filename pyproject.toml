[tool.uv.workspace]
members = ["packages/backend"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/backend/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["packages/backend/tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["packages/backend/src", "packages/backend/tests"]
