[project]
name = "py-agent-backend"
version = "0.1.0"
description = "Python backend learning service"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.165.0",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/py_agent_backend"]
